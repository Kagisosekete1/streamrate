name: Build Zyiro for iOS
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/ios-release.yml']
permissions:
  contents: read
jobs:
  archive:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile && npm run build && pnpm exec cap sync ios
      - name: Compile iPhone release
        run: xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Zyiro.xcarchive" CODE_SIGNING_ALLOWED=NO CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" archive
      - name: Sign and export App Store IPA
        env:
          P12: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          PROFILE: ${{ secrets.IOS_APPSTORE_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          : "${P12:?Configure IOS_DISTRIBUTION_P12_BASE64}" "${PROFILE:?Configure IOS_APPSTORE_PROFILE_BASE64}"
          cd "$RUNNER_TEMP"
          printf %s "$P12" | base64 -D > signing.p12
          printf %s "$PROFILE" | base64 -D > profile.mobileprovision
          security cms -D -i profile.mobileprovision > profile.plist
          team=$(/usr/libexec/PlistBuddy -c 'Print TeamIdentifier:0' profile.plist)
          uuid=$(/usr/libexec/PlistBuddy -c 'Print UUID' profile.plist)
          name=$(/usr/libexec/PlistBuddy -c 'Print Name' profile.plist)
          dir="$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
          mkdir -p "$dir"
          cp profile.mobileprovision "$dir/$uuid.mobileprovision"
          kc="$RUNNER_TEMP/signing.keychain-db"
          pass=$(openssl rand -hex 32)
          security create-keychain -p "$pass" "$kc"
          security unlock-keychain -p "$pass" "$kc"
          security import signing.p12 -k "$kc" -P "$PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$pass" "$kc" >/dev/null
          security list-keychains -d user -s "$kc" "$HOME/Library/Keychains/login.keychain-db"
          cd "$GITHUB_WORKSPACE"
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Signed.xcarchive" DEVELOPMENT_TEAM="$team" CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY="Apple Distribution" PROVISIONING_PROFILE_SPECIFIER="$name" CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" archive
          python3 -c 'import plistlib,sys; plistlib.dump(dict(method="app-store-connect",signingStyle="manual",teamID=sys.argv[1],provisioningProfiles={"com.semogrouptech.streamrateapp":sys.argv[2]}),open(sys.argv[3],"wb"))' "$team" "$uuid" "$RUNNER_TEMP/export.plist"
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Signed.xcarchive" -exportOptionsPlist "$RUNNER_TEMP/export.plist" -exportPath "$RUNNER_TEMP/export"
      - uses: actions/upload-artifact@v4
        with:
          name: Zyiro-App-Store
          path: ${{ runner.temp }}/export/*.ipa
          if-no-files-found: error
